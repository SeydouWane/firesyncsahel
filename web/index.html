<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>FireSync Sahel — Calendrier des feux harmonisé</title>
  <meta name="description" content="Calendrier des feux harmonisé MODIS/VIIRS sur 25 ans, pour n'importe quelle zone.">
  <meta name="theme-color" content="#7a2412">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <link rel="stylesheet" href="/assets/css/app.css">
  <script>
    try { const t = localStorage.getItem("fs-theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu" aria-controls="sidebar" aria-expanded="false">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/" id="brand"></a>
      <nav class="top-nav" id="top-nav" aria-label="Navigation principale"></nav>
      <nav class="space-switch" id="space-switch" aria-label="Espaces"></nav>
      <div class="spacer"></div>
      <div class="lang-toggle" role="group" aria-label="Langue / Language">
        <button data-lang="fr">FR</button><button data-lang="en">EN</button>
      </div>
      <button class="icon-btn" id="theme-btn" aria-label="Thème"></button>
      <div id="user-slot"></div>
    </header>
    <aside class="sidebar" id="sidebar" aria-label="Navigation"></aside>
    <div class="overlay" id="overlay"></div>
    <main class="content" id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="tip" id="tip" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@observablehq/plot@0.6.16/dist/plot.umd.min.js"></script>
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script type="module" src="/assets/js/main.js"></script>
</body>
</html>
